<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate Generator</title>
<style>
  :root {
    --bg:#f4f6fa; --card:#fff; --ink:#1b2430; --muted:#6b7686; --line:#e2e7ef;
    --brand:#1f3a5f; --brand-ink:#fff; --ok:#12805c; --okbg:#e3f6ee; --bad:#b42318; --badbg:#fdecea;
    --pend:#946200; --pendbg:#fff4d6; --bar:#e8edf5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f141b; --card:#171e28; --ink:#e8edf4; --muted:#93a0b2; --line:#263040;
      --brand:#6ea0ec; --brand-ink:#0b1220; --ok:#4cd3a0; --okbg:#0f2e25; --bad:#ff8a80; --badbg:#35171a;
      --pend:#f0c055; --pendbg:#33290f; --bar:#222c3a; }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:20px 16px 4px; max-width:1180px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 2px }
  header p { margin:0; color:var(--muted) }
  main { max-width:1180px; margin:16px auto 48px; padding:0 16px; display:grid; gap:16px;
    grid-template-columns: minmax(0,380px) minmax(0,1fr); align-items:start; }
  @media (max-width:860px){ main{ grid-template-columns:1fr } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  h2 { font-size:15px; margin:0 0 12px }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px }
  input, textarea, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink); font:inherit; }
  textarea { min-height:170px; font:13px/1.45 ui-monospace,Consolas,monospace; resize:vertical }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--brand); outline-offset:1px }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .hint { font-size:12px; color:var(--muted); margin-top:4px }
  button { font:inherit; cursor:pointer; border-radius:8px; padding:9px 14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); }
  button.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); font-weight:600 }
  button:disabled { opacity:.5; cursor:not-allowed }
  button:hover:not(:disabled) { filter:brightness(.96) }
  .full { width:100%; margin-top:16px }
  .empty { text-align:center; color:var(--muted); padding:48px 12px }
  .bar { height:10px; background:var(--bar); border-radius:99px; overflow:hidden; margin:12px 0 }
  .bar > div { height:100%; width:0; background:var(--brand); transition:width .3s }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px }
  .chip { padding:3px 10px; border-radius:99px; font-size:13px; font-weight:600 }
  .chip.ok { background:var(--okbg); color:var(--ok) } .chip.bad { background:var(--badbg); color:var(--bad) }
  .chip.pend { background:var(--pendbg); color:var(--pend) }
  .status { font-weight:600; text-transform:capitalize }
  .meta { color:var(--muted); font-size:13px; overflow-wrap:anywhere }
  td .meta { overflow-wrap:normal; word-break:normal }
  .tabs { display:flex; gap:4px; margin:14px 0 8px }
  .tabs button { padding:5px 12px; font-size:13px }
  .tabs button.on { background:var(--brand); color:var(--brand-ink); border-color:var(--brand) }
  .tablewrap { max-height:440px; overflow:auto; border:1px solid var(--line); border-radius:8px }
  table { width:100%; border-collapse:collapse; font-size:14px }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top }
  th { position:sticky; top:0; background:var(--card); font-size:12px; color:var(--muted); text-transform:uppercase }
  tr:last-child td { border-bottom:0 }
  .tag { font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px }
  .tag.generated { background:var(--okbg); color:var(--ok) } .tag.failed { background:var(--badbg); color:var(--bad) }
  .tag.pending { background:var(--pendbg); color:var(--pend) }
  .err { color:var(--bad); font-size:13px }
  a.dl { color:var(--brand); cursor:pointer; text-decoration:underline }
  .toast { color:var(--bad); font-size:13px; margin-top:10px; white-space:pre-wrap }
  .actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap }

  /* ===== Animations & polish ===== */
  :root { --g1:#6366f1; --g2:#06b6d4; --g3:#ec4899; --ease:cubic-bezier(.22,1,.36,1); }
  body { position:relative; overflow-x:hidden; min-height:100vh }
  .blobs { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none }
  .blobs i { position:absolute; width:46vmax; height:46vmax; border-radius:50%; filter:blur(80px); opacity:.28;
    animation:drift 22s ease-in-out infinite alternate }
  .blobs i:nth-child(1){ background:var(--g1); top:-18vmax; left:-12vmax }
  .blobs i:nth-child(2){ background:var(--g2); bottom:-20vmax; right:-14vmax; animation-duration:28s; animation-delay:-8s }
  .blobs i:nth-child(3){ background:var(--g3); top:30%; left:45%; width:30vmax; height:30vmax; opacity:.16; animation-duration:34s }
  @media (prefers-color-scheme: dark){ .blobs i{ opacity:.2 } }
  @keyframes drift { from{ transform:translate(0,0) scale(1) } to{ transform:translate(7vmax,5vmax) scale(1.18) } }

  header { display:flex; align-items:center; gap:16px; padding-top:30px }
  .logo { width:54px; height:54px; flex:none; border-radius:16px; display:grid; place-items:center; color:#fff;
    background:linear-gradient(135deg,var(--g1),var(--g3)); box-shadow:0 10px 30px -8px var(--g1);
    animation:float 4s ease-in-out infinite }
  .logo svg { width:30px; height:30px }
  @keyframes float { 50%{ transform:translateY(-7px) rotate(-4deg) } }
  h1 { font-size:clamp(24px,4vw,34px); letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g1)); background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 7s linear infinite }
  @keyframes shine { to{ background-position:250% 0 } }
  header p { animation:up .8s var(--ease) .15s both }
  @keyframes up { from{ opacity:0; transform:translateY(22px) } to{ opacity:1; transform:none } }
  @keyframes pop { 0%{ opacity:0; transform:scale(.6) } 70%{ transform:scale(1.08) } 100%{ opacity:1; transform:none } }
  @keyframes slide { from{ opacity:0; transform:translateX(-18px) } to{ opacity:1; transform:none } }

  .card { backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:18px;
    background-color:color-mix(in srgb, var(--card) 80%, transparent);
    background-image:radial-gradient(420px circle at var(--mx,50%) var(--my,-20%), rgba(99,102,241,.14), transparent 45%);
    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 18px 40px -22px rgba(31,58,95,.35);
    transition:transform .35s var(--ease), box-shadow .35s var(--ease); animation:up .8s var(--ease) both }
  main .card:nth-child(2){ animation-delay:.12s }
  .card:hover { transform:translateY(-3px); box-shadow:0 1px 2px rgba(0,0,0,.05), 0 28px 50px -20px rgba(99,102,241,.45) }

  input, textarea, select { transition:border-color .25s, box-shadow .25s, transform .25s var(--ease) }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--g1); box-shadow:0 0 0 4px rgba(99,102,241,.18); transform:translateY(-1px) }
  label { transition:color .25s } 
  #preview { white-space:nowrap; font-size:13px; font-weight:600; color:var(--g1); text-decoration:none; padding:8px 12px;
    border-radius:8px; background:rgba(99,102,241,.1); transition:all .25s var(--ease) }
  #preview:hover { background:var(--g1); color:#fff; transform:translateY(-2px) }

  button { position:relative; overflow:hidden; transition:transform .2s var(--ease), box-shadow .25s, filter .2s }
  button:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 8px 18px -8px rgba(0,0,0,.35) }
  button:active:not(:disabled) { transform:scale(.96) }
  button.primary { background:linear-gradient(120deg,var(--g1),var(--g2),var(--g3)); background-size:220% 100%;
    border:0; color:#fff; animation:flow 6s ease infinite }
  @keyframes flow { 50%{ background-position:100% 0 } }
  button.primary::after { content:""; position:absolute; top:0; left:-80%; width:50%; height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent); transform:skewX(-20deg) }
  button.primary:hover:not(:disabled)::after { animation:sweep .8s ease }
  @keyframes sweep { to{ left:140% } }
  button.primary.busy { pointer-events:none; filter:saturate(.8) }
  button.primary.busy::before { content:""; display:inline-block; width:13px; height:13px; margin-right:8px; vertical-align:-2px;
    border:2px solid rgba(255,255,255,.5); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite }
  @keyframes spin { to{ transform:rotate(360deg) } }
  .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,.5); transform:scale(0); pointer-events:none;
    animation:rip .6s ease-out forwards }
  @keyframes rip { to{ transform:scale(4); opacity:0 } }

  .bar { height:12px; box-shadow:inset 0 1px 3px rgba(0,0,0,.12) }
  .bar > div { background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3)); transition:width .9s var(--ease); position:relative }
  .running .bar > div { background-size:200% 100%; animation:flow 2s linear infinite }
  .running .bar > div::after { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 10px,transparent 10px 20px);
    animation:stripes 1s linear infinite }
  @keyframes stripes { to{ background-position:28px 0 } }
  .status::before { content:""; display:inline-block; width:9px; height:9px; margin-right:7px; border-radius:50%; background:var(--ok) }
  .status.s-processing::before, .status.s-queued::before { background:var(--pend); animation:pulse 1.1s ease-in-out infinite }
  .status.s-failed::before { background:var(--bad) }
  @keyframes pulse { 0%{ box-shadow:0 0 0 0 rgba(240,192,85,.7) } 100%{ box-shadow:0 0 0 10px rgba(240,192,85,0) } }

  .fresh .chip { animation:pop .55s var(--ease) both }
  .fresh .chip:nth-child(2){ animation-delay:.07s } .fresh .chip:nth-child(3){ animation-delay:.14s } .fresh .chip:nth-child(4){ animation-delay:.21s }
  .fresh tbody tr { animation:slide .5s var(--ease) both; animation-delay:calc(var(--i,0) * 45ms) }
  tbody tr { transition:background .2s } tbody tr:hover { background:rgba(99,102,241,.07) }
  .tabs button.on { background:linear-gradient(120deg,var(--g1),var(--g2)); border:0; color:#fff }
  .tag { transition:transform .2s var(--ease) } tr:hover .tag { transform:scale(1.08) }
  a.dl { text-decoration:none; font-weight:600; background:linear-gradient(var(--g1),var(--g1)) 0 100%/0 2px no-repeat; transition:background-size .3s }
  a.dl:hover { background-size:100% 2px }
  .empty { animation:float 5s ease-in-out infinite }
  #confetti { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50 }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important } }
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>
<canvas id="confetti"></canvas>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 14.2 7 22l5-3 5 3-1.5-7.8"/><path d="m9.5 9 1.8 1.8L14.7 7.4"/></svg></div>
  <div><h1>Bulk Certificate Generator</h1>
  <p>Paste a list of recipients, get a PDF certificate for each. Failures never block the rest.</p></div>
</header>

<main>
  <section class="card">
    <h2>New batch</h2>
    <label for="course">Course / event name</label>
    <input id="course" value="Python for Backend Engineers" maxlength="200">
    <label for="issuer">Issued by</label>
    <input id="issuer" value="AEREO Academy" maxlength="200">
    <label for="date">Issue date</label>
    <input id="date" type="date">
    <label for="template">Certificate template</label>
    <div class="row">
      <select id="template" style="flex:1; width:auto"><option value="classic">Classic Blue</option></select>
      <a id="preview" href="/api/v1/templates/classic/preview" target="_blank" rel="noopener">Preview</a>
    </div>
    <div class="hint" id="tdesc"></div>
    <label for="rec">Recipients <span id="count" class="meta"></span></label>
    <textarea id="rec" spellcheck="false" placeholder="One per line:  Name, email&#10;Asha Rao, asha@example.com&#10;Ben Carter"></textarea>
    <div class="row" style="margin-top:6px">
      <button type="button" id="csvbtn">Load CSV…</button>
      <input id="csv" type="file" accept=".csv,text/csv" hidden>
      <button type="button" id="sample">Fill sample</button>
    </div>
    <div class="hint">Email is optional. Invalid rows (blank name, bad email, duplicates) are reported individually.</div>
    <label for="key">API key <span class="meta">(only if the server requires one)</span></label>
    <input id="key" type="password" autocomplete="off">
    <button class="primary full" id="go">Generate certificates</button>
    <div id="formerr" class="toast"></div>
  </section>

  <section class="card" id="result">
    <div class="empty">Your batch progress and results will appear here.</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const API = "/api/v1";
let jobId = null, timer = null, filter = "all", certs = [], lastJob = null, lastKey = "", lastPct = 0, celebrated = new Set();

$("date").value = new Date().toISOString().slice(0,10);
try { $("key").value = sessionStorage.getItem("apikey") || ""; } catch(e) {}

const headers = (extra={}) => { const k=$("key").value.trim(); return k ? {...extra,"X-API-Key":k} : extra; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function loadTemplates() {
  try {
    const list = await (await fetch(API + "/templates")).json();
    const sel = $("template"); sel.innerHTML = "";
    list.forEach(t => { const o = document.createElement("option"); o.value = t.id; o.textContent = t.label; o.dataset.desc = t.description; sel.appendChild(o); });
    try { const saved = localStorage.getItem("template"); if (saved && list.some(t => t.id === saved)) sel.value = saved; } catch(e) {}
    syncTemplate();
  } catch (e) { /* keep the default option */ }
}
function syncTemplate() {
  const sel = $("template"), o = sel.options[sel.selectedIndex];
  $("preview").href = API + "/templates/" + sel.value + "/preview";
  $("tdesc").textContent = (o && o.dataset.desc) || "";
  try { localStorage.setItem("template", sel.value); } catch(e) {}
}
$("template").addEventListener("change", syncTemplate);
loadTemplates();

function parseRecipients(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const [name, ...rest] = line.split(",");
    const email = rest.join(",").trim();
    const r = { name: name.trim() };
    if (email) r.email = email;
    return r;
  });
}
function updateCount() { const n = parseRecipients($("rec").value).length; $("count").textContent = n ? `(${n})` : ""; }
$("rec").addEventListener("input", updateCount);

$("sample").onclick = () => {
  $("rec").value = ["Asha Rao, asha@example.com","Ben Carter, ben@example.com","Chitra Menon","  , blank-name@example.com","Dev Patel, not-an-email","Asha Again, asha@example.com"].join("\n");
  updateCount();
};
$("csvbtn").onclick = () => $("csv").click();
$("csv").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  let lines = (await f.text()).split(/\r?\n/).filter(Boolean);
  if (lines.length && /^\s*name\s*,/i.test(lines[0])) lines = lines.slice(1);   // drop header row
  $("rec").value = lines.join("\n"); updateCount(); e.target.value = "";
};

async function api(path, opts={}) {
  const r = await fetch(API + path, { ...opts, headers: headers(opts.headers || {}) });
  if (!r.ok) {
    let detail = r.statusText;
    try { const j = await r.json(); detail = typeof j.detail === "string" ? j.detail
      : j.detail.map(d => `${d.loc.slice(1).join(".")}: ${d.msg}`).join("\n"); } catch(e) {}
    const err = new Error(detail); err.status = r.status; throw err;
  }
  return r;
}

$("go").onclick = async () => {
  $("formerr").textContent = "";
  const recipients = parseRecipients($("rec").value);
  if (!recipients.length) { $("formerr").textContent = "Add at least one recipient."; return; }
  try { sessionStorage.setItem("apikey", $("key").value); } catch(e) {}
  $("go").disabled = true; $("go").classList.add("busy");
  try {
    const r = await api("/jobs", { method:"POST",
      headers: { "Content-Type":"application/json", "Idempotency-Key": crypto.randomUUID() },
      body: JSON.stringify({ course_name:$("course").value, issuer_name:$("issuer").value,
        issue_date:$("date").value || undefined, template:$("template").value, recipients }) });
    const job = await r.json();
    follow(job.id);
  } catch (e) {
    $("formerr").textContent = e.status === 401 ? "The server needs an API key (enter it above)." : e.message;
  } finally { $("go").disabled = false; $("go").classList.remove("busy"); }
};

function follow(id) {
  jobId = id; filter = "all"; location.hash = "job=" + id;
  clearInterval(timer); poll(); timer = setInterval(poll, 800);
}

const FINISHED = ["completed","completed_with_errors","failed"];

async function poll() {
  try {
    lastJob = await (await api("/jobs/" + jobId)).json();
    certs = await fetchAllCerts();
    render();
    if (FINISHED.includes(lastJob.status)) clearInterval(timer);
  } catch (e) {
    clearInterval(timer);
    $("result").innerHTML = `<div class="empty">${esc(e.status===404 ? "Job not found." : e.message)}</div>`;
  }
}

async function fetchAllCerts() {
  let all = [], offset = 0, total = 1;
  while (offset < total) {
    const page = await (await api(`/jobs/${jobId}/certificates?limit=500&offset=${offset}`)).json();
    all = all.concat(page.items); total = page.total; offset += 500;
  }
  return all;
}

async function download(url, filename) {
  try {
    const blob = await (await api(url.replace(location.origin + API, ""))).blob();
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { alert(e.message); }
}
const safe = s => (s||"certificate").replace(/[^\w\- ]+/g,"_").trim().replace(/\s+/g,"_");

function render() {
  const j = lastJob, p = j.progress, done = FINISHED.includes(j.status);
  const rows = certs.filter(c => filter === "all" || c.status === filter);
  $("result").innerHTML = `
    <h2>${esc(j.course_name)} <span class="meta">· ${esc(j.issuer_name)}</span></h2>
    <div><span class="status s-${esc(j.status)}">${esc(j.status.replaceAll("_"," "))}</span>
      <span class="meta"> · ${p.percent_complete}% · job ${esc(j.id)}</span></div>
    <div class="bar"><div style="width:${lastPct}%"></div></div>
    <div class="chips">
      <span class="chip ok">${p.generated} generated</span>
      <span class="chip bad">${p.failed} failed</span>
      <span class="chip pend">${p.pending} pending</span>
      <span class="chip" style="background:var(--bar)">${p.total} total</span>
    </div>
    <div class="actions">
      <button class="primary" id="zip" ${done && p.generated ? "" : "disabled"}>Download all (ZIP)</button>
      <button id="retry" ${done && certs.some(c=>c.failure_type==="generation") ? "" : "disabled"}>Retry generation failures</button>
    </div>
    <div class="tabs">${["all","generated","failed","pending"].map(f =>
      `<button data-f="${f}" class="${filter===f?"on":""}">${f[0].toUpperCase()+f.slice(1)}</button>`).join("")}</div>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Recipient</th><th>Status</th><th>Details</th></tr></thead>
      <tbody>${rows.map((c, i) => `<tr style="--i:${Math.min(i, 14)}">
        <td>${c.position + 1}</td>
        <td>${esc(c.recipient_name ?? "—")}<div class="meta">${esc(c.recipient_email ?? "")}</div></td>
        <td><span class="tag ${c.status}">${c.status}</span></td>
        <td>${c.status==="generated"
              ? `<a class="dl" data-url="${esc(c.download_url)}" data-name="${esc(safe(c.recipient_name))}">Download PDF</a>`
              : c.error ? `<span class="err">${esc(c.error)}</span>` : ""}</td></tr>`).join("")
        || `<tr><td colspan="4" class="meta" style="text-align:center;padding:24px">Nothing here.</td></tr>`}</tbody>
    </table></div>`;
  const res = $("result"), key = j.id + "|" + filter, fresh = key !== lastKey;
  if (j.id !== (lastKey.split("|")[0])) lastPct = 0;
  res.classList.toggle("fresh", fresh); res.classList.toggle("running", !done); lastKey = key;
  const barEl = res.querySelector(".bar > div");
  requestAnimationFrame(() => requestAnimationFrame(() => { if (barEl) barEl.style.width = p.percent_complete + "%"; }));
  lastPct = p.percent_complete;
  if (done && p.generated && !celebrated.has(j.id)) { celebrated.add(j.id); confetti(); }
  $("zip")?.addEventListener("click", () => download(j.download_url, `certificates_${j.id}.zip`));
  $("retry")?.addEventListener("click", async () => {
    try { await api(`/jobs/${j.id}/retry`, { method:"POST" }); follow(j.id); } catch (e) { alert(e.message); }
  });
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  document.querySelectorAll("a.dl").forEach(a => a.onclick = () => download(a.dataset.url, `certificate_${a.dataset.name}.pdf`));
}

// ---- extras: ripple, card spotlight, confetti ----
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), s = document.createElement("span");
  s.className = "ripple"; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s); setTimeout(() => s.remove(), 650);
});
document.addEventListener("pointermove", e => {
  document.querySelectorAll(".card").forEach(c => { const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px"); c.style.setProperty("--my", (e.clientY - r.top) + "px"); });
});
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), x = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#6366f1","#06b6d4","#ec4899","#f59e0b","#10b981","#facc15"];
  const ps = Array.from({length:150}, () => ({ x:innerWidth/2, y:innerHeight*0.35, vx:(Math.random()-.5)*16, vy:-Math.random()*14-4,
    w:6+Math.random()*7, h:4+Math.random()*6, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[(Math.random()*cols.length)|0] }));
  let t = 0;
  (function frame() {
    x.clearRect(0, 0, cv.width, cv.height); t++;
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - t/170); x.fillStyle = p.c;
      x.fillRect(-p.w/2, -p.h/2, p.w, p.h); x.restore(); });
    if (t < 170) requestAnimationFrame(frame); else x.clearRect(0, 0, cv.width, cv.height);
  })();
}

const m = location.hash.match(/job=([\w-]+)/);
if (m) follow(m[1]);
updateCount();
